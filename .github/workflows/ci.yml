name: ci

# Pull-request and main-branch CI for the Mnemoverse Memory extension.
#
# Runs the same gates the release build runs (.github/workflows/publish.yml),
# so a broken build shows up on the PR instead of at tag time:
#   npm ci -> version consistency -> tsc -> vitest -> .vsix contents -> vsce package
# and uploads the .vsix so a reviewer can install the exact build by hand
# (Extensions view -> "..." -> Install from VSIX...).
#
# No secrets are used here and the token is read-only. Third-party actions
# are pinned by commit SHA; Dependabot (.github/dependabot.yml) bumps them.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to the same PR supersedes the previous run; runs on main are
# never cancelled, so every main commit keeps a result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Explicit `shell: bash` makes GitHub run with -eo pipefail.
    shell: bash

jobs:
  build:
    name: Build, test, package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node (version from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # Read-only job with no secrets, so the npm cache is safe here.
          # The publish workflow does not use it (cache-poisoning guidance
          # in the setup-node README).
          cache: npm

      # Same install as the release build: no dependency install scripts.
      # Nothing here needs them (see the comment in publish.yml's build job).
      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: Check the release CLIs are locked devDependencies
        # publish.yml runs `npx --no ovsx` / `npx --no vsce`, which fail
        # rather than download when the package is not installed from the
        # lockfile. Nothing else in CI runs ovsx, so without this step a PR
        # that drops it from devDependencies would pass here and break the
        # next release. The `--` stops npx from reading --version as its own
        # flag. vsce is covered by check:package and the Package step.
        run: npx --no -- ovsx --version

      - name: Check version consistency
        # package.json == package-lock.json (both fields); CHANGELOG has a
        # heading for the version or an Unreleased heading.
        run: npm run check:version

      - name: Compile
        run: npm run compile

      - name: Test
        run: npm test

      - name: Check .vsix contents (vsce ls)
        # No src/, *.test.js, *.map, node_modules, repo tooling; main entry
        # and icon present. See scripts/check-package.mjs.
        run: npm run check:package

      - name: Package
        id: package
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          VSIX="mnemoverse-vscode-${VERSION}.vsix"
          npx --no vsce package --out "$VSIX"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"

      - name: Upload .vsix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mnemoverse-vscode-vsix
          path: ${{ steps.package.outputs.vsix }}
          if-no-files-found: error
          retention-days: 14
          # A re-run keeps the run id, and artifact names are unique per run:
          # replace the previous attempt's file instead of failing on the name.
          overwrite: true
