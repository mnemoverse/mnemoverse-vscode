name: publish

# Release pipeline for the Mnemoverse Memory extension
# (Mnemoverse.mnemoverse-vscode on the VS Code Marketplace,
#  mnemoverse/mnemoverse-vscode on Open VSX). How to cut a release:
# docs/RELEASING.md.
#
# TAG CONVENTION
#   vX.Y.Z      stable release of package.json version X.Y.Z
#   vX.Y.Z-pre  pre-release of package.json version X.Y.Z: packaged and
#               published with --pre-release, GitHub release marked
#               "pre-release". package.json itself stays plain X.Y.Z; the
#               Marketplace does not accept semver pre-release suffixes.
#   Both stores accept each version number once, so a version is either a
#   pre-release or a stable release, never both. By Microsoft's convention
#   pre-releases use odd minors (0.3.x) and stable releases even ones (0.4.x).
#   Any other tag shape fails the build job.
#
# JOBS
#   build        Checks out the tag, verifies it (tag == package.json version,
#                lockfile and CHANGELOG agree, tagged commit is on main, the
#                same version was not tagged in the other flavour), then
#                npm ci, compile, test, checks the .vsix contents and packages
#                it once. Uploads the .vsix as the `vsix` artifact.
#   openvsx      Publishes that exact .vsix to Open VSX with OVSX_PAT.
#   marketplace  Publishes that exact .vsix to the VS Code Marketplace.
#                Runs in the `marketplace` environment. Auth: Microsoft Entra
#                ID (azure/login + `vsce --azure-credential`) when the
#                AZURE_CLIENT_ID variable is set, else the VSCE_PAT secret.
#                VSCE_PAT is an Azure DevOps global PAT, and those stop
#                working on 2026-12-01; see the owner checklist in
#                docs/RELEASING.md.
#   release      Creates the GitHub release with the .vsix attached, if at
#                least one store succeeded. The job summary and the release
#                notes say which store published.
#
#   openvsx and marketplace are independent jobs on purpose. The previous
#   single-job workflow ran the Marketplace step first, so a Marketplace auth
#   failure also skipped Open VSX, which is the larger channel.
#
# RE-RUNNING
#   Both publish commands use --skip-duplicate, so "Re-run failed jobs" on a
#   partly failed run publishes only to the store that failed and then
#   updates the GitHub release. Re-runs reuse the run's `vsix` artifact.
#   A new run for an existing tag: Actions -> publish -> Run workflow, tag =
#   the tag. Works for tags created after this workflow landed (older tags
#   have no .nvmrc or scripts/check-version.mjs).
#
# SECRETS AND VARIABLES (Settings -> Secrets and variables -> Actions)
#   OVSX_PAT          secret    Open VSX access token (namespace mnemoverse).
#   VSCE_PAT          secret    Azure DevOps PAT, Marketplace (Manage) scope.
#                               Fallback only; delete after the Entra switch.
#   AZURE_CLIENT_ID   variable  Client ID of the user-assigned managed
#                               identity that is a member of publisher
#                               Mnemoverse. Setting it switches the
#                               Marketplace job to Entra ID.
#   AZURE_TENANT_ID   variable  Entra tenant of that identity.
#
# SECURITY NOTES
#   - Workflow inputs and refs reach shell scripts only through `env:`,
#     never through ${{ }} inside `run:` (expression injection).
#   - Third-party actions are pinned by full commit SHA; Dependabot bumps them.
#   - No npm cache in this workflow (setup-node's cache-poisoning guidance
#     for jobs that handle secrets); publish jobs install with
#     --ignore-scripts, so no dependency install script runs in a job that
#     later holds a store credential.
#   - The ancestry check below stops accidental releases from unmerged
#     commits. It does not stop a deliberate one: a tag push runs the
#     workflow file at the tagged commit. The real gate is repository
#     settings (a ruleset restricting who may create v* tags, and required
#     reviewers / a tag-only deployment policy on the `marketplace`
#     environment); see docs/RELEASING.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.4.0 or v0.3.0-pre"
        required: true
        type: string

# Nothing by default; each job asks for what it needs.
permissions: {}

# Never run two publishes of the same tag at the same time (a tag push and a
# manual run, or two manual runs). Queued, not cancelled: a cancelled publish
# can leave one store updated and the other not.
concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    # Explicit `shell: bash` makes GitHub run with -eo pipefail.
    shell: bash

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      vsix: ${{ steps.package.outputs.vsix }}
    steps:
      - name: Resolve the release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          # Shape check before the value is used as a git ref. The full rules
          # (version match, CHANGELOG, duplicates) run after checkout, in
          # scripts/check-version.mjs.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-pre)?$ ]]; then
            # Print a sanitised copy: the raw value could carry a workflow command.
            echo "::error::Not a release tag: '${TAG//[^A-Za-z0-9._-]/?}'. Use vX.Y.Z or vX.Y.Z-pre."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          # Full history and all tags: needed for the ancestry check and for
          # the duplicate-version check in check-version.mjs.
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tagged commit is on main
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # HEAD, not $GITHUB_SHA: on workflow_dispatch GITHUB_SHA is the head
          # of the branch the run was started from, not the tag, and the
          # check would pass trivially.
          COMMIT="$(git rev-parse HEAD)"
          if ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            echo "::error::origin/main was not fetched; cannot verify $TAG."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$COMMIT" refs/remotes/origin/main; then
            echo "::error::$TAG points to $COMMIT, which is not on main. Merge the release PR, then tag the merge commit."
            exit 1
          fi
          echo "$TAG -> $COMMIT is on main"

      - name: Setup Node (version from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Check versions (tag, package.json, lockfile, CHANGELOG)
        id: version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        # Writes version= and prerelease= to $GITHUB_OUTPUT.
        run: node scripts/check-version.mjs --tag "$TAG"

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Test
        run: npm test

      - name: Check .vsix contents (vsce ls)
        run: npm run check:package

      - name: Package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          VSIX="mnemoverse-vscode-${VERSION}.vsix"
          ARGS=(package --out "$VSIX")
          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=(--pre-release)
          fi
          npx vsce "${ARGS[@]}"

          # The pre-release flag lives in the package manifest, and that is
          # what the stores read. Check it says what the tag says.
          if unzip -p "$VSIX" extension.vsixmanifest | grep -q 'Id="Microsoft.VisualStudio.Code.PreRelease" Value="true"'; then
            PACKAGED_PRE=true
          else
            PACKAGED_PRE=false
          fi
          if [ "$PACKAGED_PRE" != "$PRERELEASE" ]; then
            echo "::error::Tag says prerelease=$PRERELEASE but the packaged manifest says $PACKAGED_PRE."
            exit 1
          fi

          SHA256="$(sha256sum "$VSIX" | cut -d' ' -f1)"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"
          {
            echo "### Package"
            echo ""
            echo "- File: \`$VSIX\` (pre-release: $PRERELEASE)"
            echo "- SHA-256: \`$SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload .vsix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: ${{ steps.package.outputs.vsix }}
          if-no-files-found: error
          # Re-running failed jobs is possible for 30 days; keep the file
          # that long so a re-run publishes the same bytes.
          retention-days: 30

  openvsx:
    name: Publish to Open VSX
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Checkout + npm ci only to run the ovsx version locked in
      # package-lock.json; the .vsix itself comes from the build job.
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.build.outputs.tag }}
          persist-credentials: false

      - name: Setup Node (version from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: Download .vsix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
          path: dist

      - name: Publish
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX: dist/${{ needs.build.outputs.vsix }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::The OVSX_PAT secret is not set (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          ARGS=(publish "$VSIX" -p "$OVSX_PAT" --skip-duplicate)
          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=(--pre-release)
          fi
          npx ovsx "${ARGS[@]}"

  marketplace:
    name: Publish to VS Code Marketplace
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Entra federated credential trusts exactly this subject:
    #   repo:mnemoverse/mnemoverse-vscode:environment:marketplace
    # Renaming the environment breaks Entra sign-in until the credential is
    # updated. GitHub creates the environment on first use if it is missing.
    environment: marketplace
    permissions:
      contents: read
      # Job permissions cannot depend on a variable, so this is requested
      # even while the PAT fallback is in use. The token it allows is only
      # accepted by a federated credential that trusts the subject above.
      id-token: write
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.build.outputs.tag }}
          persist-credentials: false

      - name: Setup Node (version from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: Download .vsix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
          path: dist

      - name: Sign in to Azure (Entra ID workload identity)
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # The managed identity needs no Azure role, only Marketplace
          # publisher membership, so it may see no subscription at all.
          allow-no-subscriptions: true

      - name: Publish (Entra ID)
        if: vars.AZURE_CLIENT_ID != ''
        env:
          VSIX: dist/${{ needs.build.outputs.vsix }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          # --azure-credential picks up the Azure CLI session azure/login
          # just created and requests a token for the Azure DevOps resource.
          ARGS=(publish --packagePath "$VSIX" --azure-credential --skip-duplicate)
          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=(--pre-release)
          fi
          npx vsce "${ARGS[@]}"

      - name: Publish (VSCE_PAT fallback)
        if: vars.AZURE_CLIENT_ID == ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX: dist/${{ needs.build.outputs.vsix }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Neither the AZURE_CLIENT_ID variable nor the VSCE_PAT secret is set. See docs/RELEASING.md."
            exit 1
          fi
          echo "::warning::Marketplace publish used VSCE_PAT. Azure DevOps global PATs stop working on 2026-12-01; switch to Entra ID (docs/RELEASING.md, owner checklist)."
          ARGS=(publish --packagePath "$VSIX" -p "$VSCE_PAT" --skip-duplicate)
          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=(--pre-release)
          fi
          npx vsce "${ARGS[@]}"

  release:
    name: GitHub release
    needs: [build, openvsx, marketplace]
    # always(): run even when one store job failed, so the release and its
    # .vsix exist for the store that worked. Skip when nothing was published.
    if: >-
      always() &&
      needs.build.result == 'success' &&
      (needs.openvsx.result == 'success' || needs.marketplace.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download .vsix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
          path: dist

      - name: Write release notes and job summary
        env:
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          VSIX: ${{ needs.build.outputs.vsix }}
          OPENVSX_RESULT: ${{ needs.openvsx.result }}
          MARKETPLACE_RESULT: ${{ needs.marketplace.result }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MARKETPLACE_URL="https://marketplace.visualstudio.com/items?itemName=Mnemoverse.mnemoverse-vscode"
          OPENVSX_URL="https://open-vsx.org/extension/mnemoverse/mnemoverse-vscode"
          SHA256="$(sha256sum "dist/$VSIX" | cut -d' ' -f1)"

          status() {
            if [ "$1" = "success" ]; then echo "published"; else echo "not published (job $1)"; fi
          }

          {
            echo "## $TAG"
            echo ""
            echo "| Store | Result |"
            echo "| --- | --- |"
            echo "| [VS Code Marketplace]($MARKETPLACE_URL) | $(status "$MARKETPLACE_RESULT") |"
            echo "| [Open VSX]($OPENVSX_URL) | $(status "$OPENVSX_RESULT") |"
            echo ""
            if [ "$MARKETPLACE_RESULT" != "success" ] || [ "$OPENVSX_RESULT" != "success" ]; then
              echo "One store failed. Fix the cause, then use **Re-run failed jobs**:"
              echo "\`--skip-duplicate\` makes the store that already has $VERSION a no-op."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          for pair in "VS Code Marketplace:$MARKETPLACE_RESULT" "Open VSX:$OPENVSX_RESULT"; do
            if [ "${pair#*:}" != "success" ]; then
              echo "::warning::${pair%%:*} was not published (job ${pair#*:}). Re-run the failed job: $RUN_URL"
            fi
          done

          {
            if [ "$PRERELEASE" = "true" ]; then
              echo "Pre-release of Mnemoverse Memory $VERSION. The stores offer it only to users who choose"
              echo "**Switch to Pre-Release Version** on the extension page; everyone else stays on the latest stable release."
            else
              echo "Mnemoverse Memory $VERSION."
            fi
            echo ""
            echo "| Store | This version |"
            echo "| --- | --- |"
            echo "| [VS Code Marketplace]($MARKETPLACE_URL) | $(status "$MARKETPLACE_RESULT") |"
            echo "| [Open VSX]($OPENVSX_URL) | $(status "$OPENVSX_RESULT") |"
            echo ""
            echo "\`$VSIX\` below is the file this workflow uploads to the stores."
            echo "SHA-256: \`$SHA256\`"
            echo ""
            echo "Changes: [CHANGELOG.md]($REPO_URL/blob/$TAG/CHANGELOG.md)"
          } > release-notes.md

      - name: Create or update the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.tag }}
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          body_path: release-notes.md
          generate_release_notes: true
          files: dist/${{ needs.build.outputs.vsix }}
          fail_on_unmatched_files: true
