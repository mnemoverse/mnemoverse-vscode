name: marketplace-auth-check

# Manual check of the credential the publish workflow will use for the
# VS Code Marketplace. Publishes nothing and consumes no version number.
#
# Use it while migrating from VSCE_PAT to Microsoft Entra ID (owner checklist
# in docs/RELEASING.md): Actions -> marketplace-auth-check -> Run workflow,
# with the managed identity's client ID and tenant ID in the `client_id` and
# `tenant_id` inputs. It signs in exactly like publish.yml's marketplace job
# (same `marketplace` environment, so the same federated-credential subject),
# prints the identity's Marketplace profile id (the id to add as a publisher
# member), and runs `vsce verify-pat` against publisher Mnemoverse. On the
# first run, before the identity is a member, the verify step is expected to
# fail; add the printed id, then run it again.
#
# Why inputs: setting the AZURE_CLIENT_ID / AZURE_TENANT_ID repository
# variables is what switches publish.yml to Entra ID. Testing through the
# inputs first means the variables are set only once the identity works, so
# there is no window in which releases fail on the Marketplace while
# VSCE_PAT would still have worked. With the inputs empty, the job tests
# whatever publish.yml would use now: the variables if set, else VSCE_PAT.
#
# What a green run proves: the identity (or PAT) can authenticate to the
# Marketplace and has *some* role on the publisher. `verify-pat` accepts any
# of Creator, Owner, Contributor or Reader, so it does not prove the identity
# can publish; the first -pre release does that.
#
# If the `marketplace` environment is later restricted to v* tags, start this
# workflow from a tag (Run workflow -> "Use workflow from" -> Tags).

on:
  workflow_dispatch:
    inputs:
      client_id:
        description: "Managed identity client ID to test. Empty: the AZURE_CLIENT_ID variable (or VSCE_PAT if that is unset too)."
        required: false
        type: string
      tenant_id:
        description: "Entra tenant ID of that identity. Empty: the AZURE_TENANT_ID variable."
        required: false
        type: string

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify Marketplace credential
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node (version from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: Choose the credential to test
        id: cred
        env:
          INPUT_CLIENT_ID: ${{ inputs.client_id }}
          INPUT_TENANT_ID: ${{ inputs.tenant_id }}
          VAR_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          VAR_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          # Inputs win over the repository variables (see the header).
          CLIENT_ID="${INPUT_CLIENT_ID:-$VAR_CLIENT_ID}"
          TENANT_ID="${INPUT_TENANT_ID:-$VAR_TENANT_ID}"
          if [ -z "$CLIENT_ID" ]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Both values go to azure/login and into $GITHUB_OUTPUT; a strict
          # GUID shape rules out typos and stray newlines alike.
          GUID='^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
          if [[ ! "$CLIENT_ID" =~ $GUID ]] || [[ ! "$TENANT_ID" =~ $GUID ]]; then
            echo "::error::The client ID and tenant ID must both be set, as GUIDs (xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx)."
            exit 1
          fi
          {
            echo "mode=entra"
            echo "client_id=$CLIENT_ID"
            echo "tenant_id=$TENANT_ID"
          } >> "$GITHUB_OUTPUT"
          {
            if [ -n "$INPUT_CLIENT_ID" ]; then
              echo "Testing Entra ID sign-in for client \`$CLIENT_ID\` (from the \`client_id\` input)."
              if [ "$CLIENT_ID" != "$VAR_CLIENT_ID" ]; then
                echo "publish.yml does not use this identity until the AZURE_CLIENT_ID and AZURE_TENANT_ID variables are set to it."
              fi
            else
              echo "Testing Entra ID sign-in for client \`$CLIENT_ID\` (from the AZURE_CLIENT_ID variable, as publish.yml does)."
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sign in to Azure (Entra ID workload identity)
        if: steps.cred.outputs.mode == 'entra'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ steps.cred.outputs.client_id }}
          tenant-id: ${{ steps.cred.outputs.tenant_id }}
          allow-no-subscriptions: true

      - name: Show the identity's Marketplace profile id
        if: steps.cred.outputs.mode == 'entra'
        run: |
          # The publisher's member list wants this Azure DevOps profile id,
          # not the managed identity's client id. It can only be read while
          # signed in as the identity, which is what this job is. The
          # resource GUID is Azure DevOps' fixed application id.
          PROFILE_ID="$(az rest \
            -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query id -o tsv)"
          echo "Marketplace profile id: $PROFILE_ID"
          {
            echo "Marketplace profile id of the identity: \`$PROFILE_ID\`"
            echo ""
            echo "Add it at https://marketplace.visualstudio.com/manage/publishers/mnemoverse"
            echo "(Members -> Add, role Contributor) if the next step fails."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify (Entra ID)
        if: steps.cred.outputs.mode == 'entra'
        run: |
          npx --no vsce verify-pat Mnemoverse --azure-credential
          echo "Entra ID sign-in works and the identity has a role on publisher Mnemoverse." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify (VSCE_PAT)
        if: steps.cred.outputs.mode == 'pat'
        env:
          # vsce verify-pat reads VSCE_PAT when -p is not given, which keeps
          # the token off the command line (npm's debug log, process title).
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::No client_id input, no AZURE_CLIENT_ID variable and no VSCE_PAT secret."
            exit 1
          fi
          npx --no vsce verify-pat Mnemoverse
          {
            echo "VSCE_PAT works today. Azure DevOps global PATs stop working on 2026-12-01;"
            echo "follow the owner checklist in docs/RELEASING.md to switch to Entra ID."
          } >> "$GITHUB_STEP_SUMMARY"
